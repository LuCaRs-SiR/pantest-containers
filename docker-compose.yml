version: "3.9"

# UWAGA: Używaj tych narzędzi wyłącznie do celów defensywnych,
# testowania własnych systemów lub systemów, do których masz pisemną zgodę.

services:
  burp:
    build: ./burp
    container_name: burp
    command: ["tail", "-f", "/dev/null"]
    tty: true
    stdin_open: true
    volumes:
      - ./burp:/app
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
    restart: unless-stopped

  nmap_suite:
    build:
      context: ./nmap-suite
      dockerfile: Dockerfile
    image: pantest-nmap-suite
    container_name: nmap-suite
    working_dir: /tools
    command: ["tail", "-f", "/dev/null"]
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./nmap-suite:/tools
    network_mode: host

  recon:
    build:
      context: ./recon
      dockerfile: Dockerfile
    image: pantest-recon
    container_name: recon
    depends_on:
      - nmap_suite
    working_dir: /tools
    command: ["tail", "-f", "/dev/null"]
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./recon:/tools
    network_mode: host

  hackagent:
    build: ./hackagent
    image: pantest-hackagent
    container_name: hackagent
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./hackagent:/app
    network_mode: host

  autopentestx:
    build: ./autopentestx
    image: pantest-autopentestx
    container_name: autopentestx
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./autopentestx:/app
    network_mode: host

  inspector:
    build: ./inspector
    image: pantest-inspector
    container_name: inspector
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]
    tty: true
    stdin_open: true
    restart: unless-stopped
    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8
    volumes:
      - ./inspector:/app
    network_mode: host

  ollama:
    image: ollama/ollama
    container_name: ollama-gpu
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_KEEP_ALIVE=24h
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-gpu:/root/.ollama
    networks:
      - pentest-net

  ollama-init:
    image: curlimages/curl:8.10.1
    container_name: ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      until curl -sf http://ollama:11434/api/tags >/dev/null; do
        echo "[ollama-init] waiting for ollama...";
        sleep 2;
      done;
      echo "[ollama-init] pulling qwen2.5-coder:7b";
      curl -sS http://ollama:11434/api/pull
      -H 'Content-Type: application/json'
      -d '{"name":"qwen2.5-coder:7b"}' >/tmp/pull.log;
      echo "[ollama-init] warming model in GPU memory";
      curl -sS http://ollama:11434/api/generate
      -H 'Content-Type: application/json'
      -d '{"model":"qwen2.5-coder:7b","prompt":"Warmup","stream":false,"keep_alive":"24h"}' >/tmp/warmup.log;
      echo "[ollama-init] done";
      exit 0
    restart: "no"
    networks:
      - pentest-net

  ai-gateway:
    build: ./ai-gateway
    image: pantest-ai-gateway
    container_name: ai-gateway
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./ai-gateway:/app
    networks:
      - pentest-net

  panel-backend:
    build: ./panel/backend
    image: pantest-panel-backend
    container_name: panel-backend
    environment:
      - AI_GATEWAY_URL=http://ai-gateway:8000
    ports:
      - "8001:8001"
    depends_on:
      - ai-gateway
      - nmap_suite
      - recon
      - inspector
      - hackagent
      - autopentestx
      - burp
      - kali
    restart: unless-stopped
    volumes:
      - ./panel/backend:/app
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pentest-net

  panel-frontend:
    build: ./panel/frontend
    image: pantest-panel-frontend
    container_name: panel-frontend
    ports:
      - "3000:3000"
    depends_on:
      - panel-backend
    restart: unless-stopped
    networks:
      - pentest-net

  kali:
    build: ./kali-tools
    image: pantest-kali-tools
    container_name: kali-tools
    working_dir: /tools
    command: ["bash"]
    tty: true
    stdin_open: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./kali-tools:/tools

networks:
  pentest-net:
    driver: bridge
